<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Thumbnail project Berkasir (1280x880). Render: buka di browser lalu screenshot 1280x880,
     atau: msedge --headless --window-size=1280,880 --screenshot=thumb.png thumbnail.html -->
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --pink:#ff4f91; --cyan:#44d9d0; --yellow:#ffd166; --violet:#7563df; --night:#17152a; --cream:#f5eddf; --app:#3949ab; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 880px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Press Start 2P', monospace;
    color: var(--cream);
    background:
      radial-gradient(circle at 76% 48%, rgba(57,73,171,.55), transparent 45%),
      radial-gradient(circle at 16% 86%, rgba(68,217,208,.18), transparent 40%),
      linear-gradient(160deg, #241c4a 0%, #1b1636 55%, #120f24 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 40px);
  }
  .scan { position: absolute; inset: 0; z-index: 20; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 4px); }
  .star { position: absolute; width: 8px; height: 8px; background: var(--cream); box-shadow: 0 0 0 4px rgba(245,237,223,.12); }
  .star.p { background: var(--pink); } .star.c { background: var(--cyan); } .star.y { background: var(--yellow); }

  .hud { position: absolute; top: 44px; left: 72px; right: 72px; display: flex; justify-content: space-between; font-size: 16px; letter-spacing: .08em; color: rgba(245,237,223,.75); z-index: 5; }
  .hud b { color: var(--cyan); font-weight: 400; }
  .rec { display: inline-block; width: 14px; height: 14px; background: var(--cyan); margin-right: 12px; vertical-align: -1px; }

  .copy { position: absolute; left: 72px; top: 170px; width: 600px; z-index: 5; }
  .badge { display: inline-block; padding: 14px 18px; font-size: 20px; color: var(--night); background: var(--cyan); border: 4px solid var(--cream); box-shadow: 6px 6px 0 var(--night); letter-spacing: .06em; }
  h1 { margin: 40px 0 0; font-weight: 400; font-size: 70px; line-height: 1.32; letter-spacing: -.02em; text-shadow: 6px 6px 0 var(--night); }
  h1 .hl { color: var(--yellow); text-shadow: 6px 6px 0 var(--pink); }
  .sub { margin: 14px 0 0; font-size: 20px; color: var(--cream); opacity: .9; }
  .made { display: flex; align-items: center; gap: 20px; margin-top: 44px; }
  .icon { width: 86px; height: 86px; display: grid; place-items: center; font-size: 26px; color: var(--cream); background: var(--app); border: 5px solid var(--cream); box-shadow: 6px 6px 0 var(--night); }
  .made p { margin: 0; font-size: 17px; line-height: 1.8; }
  .made p span { color: var(--cyan); }

  /* jendela browser pixel */
  .win { position: absolute; background: var(--night); border: 6px solid var(--night); z-index: 3; }
  .win .bar { display: flex; justify-content: space-between; align-items: center; height: 38px; padding: 0 10px; font-size: 12px; color: var(--cream); }
  .win .bar i { display: inline-block; width: 12px; height: 12px; margin-left: 6px; background: var(--pink); }
  .win .bar i + i { background: var(--yellow); } .win .bar i + i + i { background: var(--cyan); }
  .win img { display: block; width: 100%; object-fit: cover; }
  .win-a { left: 690px; top: 140px; width: 330px; transform: rotate(-6deg); box-shadow: 16px 16px 0 var(--cyan); }
  .win-a img { height: 380px; object-position: center 62%; }
  .win-b { left: 860px; top: 400px; width: 360px; transform: rotate(4deg); box-shadow: 16px 16px 0 var(--pink); z-index: 4; }
  .win-b img { height: 300px; object-position: center 55%; }

  .bubble { position: absolute; left: 1010px; top: 130px; z-index: 7; padding: 18px 22px; font-size: 15px; line-height: 1.7; color: var(--night); background: var(--yellow); border: 5px solid var(--night); box-shadow: 6px 6px 0 var(--night); }
  .bubble::after { content: ''; position: absolute; right: -18px; top: 22px; border-style: solid; border-width: 10px 0 10px 16px; border-color: transparent transparent transparent var(--night); }

  .bubble::after { left: -18px; right: auto; border-width: 10px 16px 10px 0; border-color: transparent var(--night) transparent transparent; }
  .chips { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 14px; z-index: 5; }
  .chips span { padding: 12px 14px; font-size: 14px; border: 3px solid rgba(245,237,223,.55); color: rgba(245,237,223,.9); background: rgba(23,21,42,.4); }
</style>
</head>
<body>
  <div class="grid"></div>
  <span class="star" style="left:640px;top:120px"></span>
  <span class="star p" style="left:1220px;top:120px"></span>
  <span class="star c" style="left:560px;top:560px"></span>
  <span class="star y" style="left:1190px;top:820px"></span>

  <div class="hud"><span><span class="rec" style="background:var(--yellow)"></span>WEB PROJECT</span><span>WEB <b style="color:var(--yellow)">01</b> / 2026</span></div>

  <div class="copy">
    <span class="badge" style="background:var(--yellow)">WEB APP</span>
    <h1>STICKER<br><span class="hl">KIT</span></h1>
    <p class="sub">STICKER &amp; GIF MAKER</p>
    <div class="made">
      <div class="icon" style="background:#0b7a1f">FF</div>
      <p>POWERED BY<br><span>FFMPEG</span></p>
    </div>
  </div>

  <div class="win win-a"><div class="bar"><span>STICKER.WEBP</span><span><i></i><i></i><i></i></span></div><img src="../../assets/projects/stickerkit/06-hasil-stiker.jpg"></div>
  <div class="win win-b"><div class="bar"><span>OUTPUT.GIF</span><span><i></i><i></i><i></i></span></div><img src="../../assets/projects/stickerkit/09-hasil-gif.jpg"></div>
  <div class="bubble">STIKER<br>JADI!</div>

  <div class="chips"><span>STIKER</span><span>GIF</span><span>KOMPRES</span></div>
  <div class="scan"></div>
</body>
</html>
