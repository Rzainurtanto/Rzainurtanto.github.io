<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Thumbnail project Berkasir (1280x880). Render: buka di browser lalu screenshot 1280x880,
     atau: msedge --headless --window-size=1280,880 --screenshot=thumb.png thumbnail.html -->
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --sun:#e8743b; --sea:#4f93bd; --gold:#f2b84b; --tide:#2c5f86; --ocean:#13263b; --sand:#f4efe6; --app:#2c5f86; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 880px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Press Start 2P', monospace;
    color: var(--sand);
    background:
      radial-gradient(circle at 76% 48%, rgba(44,95,134,.55), transparent 45%),
      radial-gradient(circle at 16% 86%, rgba(79,147,189,.18), transparent 40%),
      linear-gradient(160deg, #163150 0%, #10243b 55%, #0b1828 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 40px);
  }
  .scan { position: absolute; inset: 0; z-index: 20; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 4px); }
  .star { position: absolute; width: 8px; height: 8px; background: var(--sand); box-shadow: 0 0 0 4px rgba(244,239,230,.12); }
  .star.p { background: var(--sun); } .star.c { background: var(--sea); } .star.y { background: var(--gold); }

  .hud { position: absolute; top: 44px; left: 72px; right: 72px; display: flex; justify-content: space-between; font-size: 16px; letter-spacing: .08em; color: rgba(244,239,230,.75); z-index: 5; }
  .hud b { color: var(--sea); font-weight: 400; }
  .rec { display: inline-block; width: 14px; height: 14px; background: var(--sea); margin-right: 12px; vertical-align: -1px; }

  .copy { position: absolute; left: 72px; top: 170px; width: 600px; z-index: 5; }
  .badge { display: inline-block; padding: 14px 18px; font-size: 20px; color: var(--ocean); background: var(--sea); border: 4px solid var(--sand); box-shadow: 6px 6px 0 var(--ocean); letter-spacing: .06em; }
  h1 { margin: 40px 0 0; font-weight: 400; font-size: 70px; line-height: 1.32; letter-spacing: -.02em; text-shadow: 6px 6px 0 var(--ocean); }
  h1 .hl { color: var(--gold); text-shadow: 6px 6px 0 var(--sun); }
  .sub { margin: 14px 0 0; font-size: 20px; color: var(--sand); opacity: .9; }
  .made { display: flex; align-items: center; gap: 20px; margin-top: 44px; }
  .icon { width: 86px; height: 86px; display: grid; place-items: center; font-size: 26px; color: var(--sand); background: var(--app); border: 5px solid var(--sand); box-shadow: 6px 6px 0 var(--ocean); }
  .made p { margin: 0; font-size: 17px; line-height: 1.8; }
  .made p span { color: var(--sea); }

  /* jendela browser pixel */
  .win { position: absolute; background: var(--ocean); border: 6px solid var(--ocean); z-index: 3; }
  .win .bar { display: flex; justify-content: space-between; align-items: center; height: 38px; padding: 0 10px; font-size: 12px; color: var(--sand); }
  .win .bar i { display: inline-block; width: 12px; height: 12px; margin-left: 6px; background: var(--sun); }
  .win .bar i + i { background: var(--gold); } .win .bar i + i + i { background: var(--sea); }
  .win img { display: block; width: 100%; object-fit: cover; }
  .win-a { left: 640px; top: 150px; width: 430px; transform: rotate(-5deg); box-shadow: 16px 16px 0 var(--sea); }
  .win-a img { height: 245px; object-position: center 40%; }
  .win-b { left: 790px; top: 420px; width: 430px; transform: rotate(4deg); box-shadow: 16px 16px 0 var(--sun); z-index: 4; }
  .win-b img { height: 245px; object-position: center 70%; }

  .bubble { position: absolute; left: 1010px; top: 130px; z-index: 7; padding: 18px 22px; font-size: 15px; line-height: 1.7; color: var(--ocean); background: var(--gold); border: 5px solid var(--ocean); box-shadow: 6px 6px 0 var(--ocean); }
  .bubble::after { content: ''; position: absolute; right: -18px; top: 22px; border-style: solid; border-width: 10px 0 10px 16px; border-color: transparent transparent transparent var(--ocean); }

  .bubble::after { left: -18px; right: auto; border-width: 10px 16px 10px 0; border-color: transparent var(--ocean) transparent transparent; }
  .chips { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 14px; z-index: 5; }
  .chips span { padding: 12px 14px; font-size: 14px; border: 3px solid rgba(244,239,230,.55); color: rgba(244,239,230,.9); background: rgba(19,38,59,.4); }
</style>
</head>
<body>
  <div class="grid"></div>
  <span class="star" style="left:640px;top:120px"></span>
  <span class="star p" style="left:1220px;top:120px"></span>
  <span class="star c" style="left:560px;top:560px"></span>
  <span class="star y" style="left:1190px;top:820px"></span>

  <div class="hud"><span><span class="rec" style="background:#f2b84b"></span>WEB PROJECT</span><span>WEB <b style="color:#f2b84b">03</b> / 2026</span></div>

  <div class="copy">
    <span class="badge" style="background:#f2b84b">FRONTEND</span>
    <h1>JEJAK<br><span class="hl">NUSA</span></h1>
    <p class="sub">TRAVEL PLATFORM INDONESIA</p>
    <div class="made">
      <div class="icon" style="background:#0e7490">TW</div>
      <p>TAILWIND CSS<br><span>+ VITE</span></p>
    </div>
  </div>

  <div class="win win-a"><div class="bar"><span>BERANDA.HTML</span><span><i></i><i></i><i></i></span></div><img src="../../assets/projects/jejaknusa/01-beranda.jpg"></div>
  <div class="win win-b"><div class="bar"><span>DESTINASI.HTML</span><span><i></i><i></i><i></i></span></div><img src="../../assets/projects/jejaknusa/06-daftar-destinasi.jpg"></div>
  <div class="bubble">LET'S<br>TRAVEL!</div>

  <div class="chips"><span>DESTINASI</span><span>2 BAHASA</span><span>DARK MODE</span></div>
  <div class="scan"></div>
</body>
</html>
