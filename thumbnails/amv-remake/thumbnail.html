<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --pink:#ff4f91; --cyan:#44d9d0; --yellow:#ffd166; --violet:#7563df; --night:#17152a; --cream:#f5eddf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 880px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Press Start 2P', monospace;
    color: var(--cream);
    background:
      radial-gradient(circle at 78% 45%, rgba(68,217,208,.28), transparent 42%),
      radial-gradient(circle at 18% 85%, rgba(255,79,145,.22), transparent 40%),
      linear-gradient(160deg, #241c4a 0%, #1b1636 55%, #120f24 100%);
  }
  /* grid pixel */
  .grid {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 40px);
  }
  .scan { position: absolute; inset: 0; z-index: 20; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 4px); }
  .star { position: absolute; width: 8px; height: 8px; background: var(--cream); box-shadow: 0 0 0 4px rgba(245,237,223,.12); }
  .star.p { background: var(--pink); } .star.c { background: var(--cyan); } .star.y { background: var(--yellow); }

  /* frame layar */
  .hud { position: absolute; top: 44px; left: 72px; right: 72px; display: flex; justify-content: space-between; font-size: 16px; letter-spacing: .08em; color: rgba(245,237,223,.75); z-index: 5; }
  .hud b { color: var(--pink); font-weight: 400; }
  .rec { display: inline-block; width: 14px; height: 14px; background: var(--pink); margin-right: 12px; vertical-align: -1px; }

  /* kiri */
  .copy { position: absolute; left: 72px; top: 190px; width: 600px; z-index: 5; }
  .badge { display: inline-block; padding: 14px 18px; font-size: 20px; color: var(--night); background: var(--pink); border: 4px solid var(--cream); box-shadow: 6px 6px 0 var(--night); letter-spacing: .06em; }
  h1 { margin: 40px 0 0; font-weight: 400; font-size: 78px; line-height: 1.32; letter-spacing: -.02em; text-shadow: 6px 6px 0 var(--night); }
  h1 .love { color: var(--yellow); text-shadow: 6px 6px 0 var(--pink); }
  .made { display: flex; align-items: center; gap: 20px; margin-top: 44px; }
  .ae { width: 86px; height: 86px; display: grid; place-items: center; font-size: 30px; color: #b8a7ff; background: #00005b; border: 5px solid #b8a7ff; box-shadow: 6px 6px 0 var(--night); }
  .made p { margin: 0; font-size: 17px; line-height: 1.8; color: var(--cream); }
  .made p span { color: var(--cyan); }
  .chips { display: flex; gap: 14px; margin-top: 40px; }
  .chips span { padding: 12px 14px; font-size: 15px; border: 3px solid rgba(245,237,223,.55); color: rgba(245,237,223,.9); }

  /* kanan: jendela klip */
  .win { position: absolute; width: 330px; background: var(--night); border: 6px solid var(--night); z-index: 3; }
  .win .bar { display: flex; justify-content: space-between; align-items: center; height: 38px; padding: 0 10px; font-size: 12px; color: var(--cream); background: var(--night); }
  .win .bar i { display: inline-block; width: 12px; height: 12px; margin-left: 6px; background: var(--pink); }
  .win .bar i + i { background: var(--yellow); } .win .bar i + i + i { background: var(--cyan); }
  .win img { display: block; width: 100%; height: 460px; object-fit: cover; }
  .win-a { left: 690px; top: 170px; transform: rotate(-6deg); box-shadow: 16px 16px 0 var(--cyan); }
  .win-b { left: 900px; top: 250px; transform: rotate(5deg); box-shadow: 16px 16px 0 var(--pink); z-index: 4; }

  /* tombol play pixel */
  .play { position: absolute; left: 780px; top: 590px; z-index: 6; width: 132px; height: 132px; display: grid; place-items: center; background: var(--yellow); border: 6px solid var(--night); box-shadow: 8px 8px 0 var(--night); }
  .play::before { content: ''; width: 46px; height: 54px; margin-left: 10px; background: var(--night);
    clip-path: polygon(0 0, 25% 0, 25% 10%, 50% 10%, 50% 25%, 75% 25%, 75% 40%, 100% 40%, 100% 60%, 75% 60%, 75% 75%, 50% 75%, 50% 90%, 25% 90%, 25% 100%, 0 100%); }

  /* balon manga */
  .bubble { position: absolute; left: 1040px; top: 104px; z-index: 7; padding: 22px 26px; font-size: 16px; line-height: 1.7; color: var(--night); background: #fff; border: 5px solid var(--night); border-radius: 50%; text-align: center; box-shadow: 6px 6px 0 var(--night); }

  /* bar progres bawah */
  .timeline { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; align-items: center; gap: 20px; font-size: 15px; z-index: 5; color: rgba(245,237,223,.8); }
  .track { flex: 1; height: 22px; padding: 3px; border: 3px solid rgba(245,237,223,.7); }
  .track i { display: block; width: 62%; height: 100%; background: repeating-linear-gradient(90deg, var(--cyan) 0 14px, transparent 14px 18px); }
</style>
</head>
<body>
  <div class="grid"></div>
  <span class="star" style="left:640px;top:120px"></span>
  <span class="star p" style="left:1200px;top:640px"></span>
  <span class="star c" style="left:600px;top:700px"></span>
  <span class="star y" style="left:1180px;top:90px"></span>
  <span class="star" style="left:96px;top:610px;opacity:.5"></span>

  <div class="hud"><span><span class="rec"></span>MOTION PROJECT</span><span>VIDEO <b>01</b> / 2026</span></div>

  <div class="copy">
    <span class="badge">ANIME EDIT</span>
    <h1>AMV<br><span class="love">REMAKE</span></h1>
    <div class="made">
      <div class="ae">Ae</div>
      <p>MADE WITH<br><span>AFTER EFFECTS</span></p>
    </div>
  </div>

  <div class="win win-a"><div class="bar"><span>CLIP_A.MP4</span><span><i></i><i></i><i></i></span></div><img src="frame-detik-17.jpg"></div>
  <div class="win win-b"><div class="bar"><span>CLIP_B.MP4</span><span><i></i><i></i><i></i></span></div><img src="frame-detik-06.jpg"></div>
  <div class="play"></div>
  <div class="bubble">PRESS<br>PLAY!</div>

  <div class="timeline"><span>0:23</span><span class="track"><i></i></span><span>0:37</span></div>
  <div class="scan"></div>
</body>
</html>
